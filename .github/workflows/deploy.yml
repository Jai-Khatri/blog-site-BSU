name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/blog-backend:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/blog-backend:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          gcloud run deploy blog-backend \
            --image "docker.io/${{ vars.DOCKERHUB_USERNAME }}/blog-backend:${IMAGE_TAG}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --set-env-vars "MONGODB_URI=${MONGODB_URI},JWT_SECRET=${JWT_SECRET}"

      - name: Get backend URL
        id: backend
        run: |
          BACKEND_URL=$(gcloud run services describe blog-backend \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="value(status.url)")

          echo "url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ steps.backend.outputs.url }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/blog-frontend:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/blog-frontend:latest

      - name: Deploy frontend
        run: |
          gcloud run deploy blog-frontend \
            --image "docker.io/${{ vars.DOCKERHUB_USERNAME }}/blog-frontend:${IMAGE_TAG}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated